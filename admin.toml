project_name    = "admin-project-tool"
python_min      = "3.11"
generator_commit = "369752ed5815575e0f1b326a45424409684d788d"
archetypes      = []
modules         = ["core"]

[commands.build]
desc     = "Regenerate ./admin and audit for drift"
steps    = ["build"]
group    = 1
priority = 10

[commands.dev]
desc     = "Run admin-gen on this project interactively"
steps    = ["run-dev"]
group    = 1
priority = 20

[commands.deploy]
desc     = "Install to ~/.admin"
steps    = ["install"]
group    = 1
priority = 30

[commands.test]
desc     = "Run full test suite (Python + shell)"
steps    = ["test"]
group    = 2
priority = 10

[actions.build]
kind = "shell"
desc = "Regenerate ./admin and audit for drift"
run  = "python3 ./admin-gen --regenerate . --force-dirty && python3 ./admin-gen --audit . --force-dirty"

[actions.run-dev]
kind = "shell"
desc = "Run admin-gen on this project interactively"
run  = "python3 ./admin-gen . --force-dirty"

[actions.test]
kind = "shell"
desc = "Run full test suite (pytest + shell)"
run  = ".venv/bin/pytest tests/ && bash tests/test_install.sh"

[actions.install]
kind = "shell"
desc = "Install to ~/.admin"
run  = "bash install.sh"
