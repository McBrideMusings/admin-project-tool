project_name    = "admin-project-tool"
python_min      = "3.11"
generator_commit = "6be1ac3c9baa045c4396ec1d61da357ca8f0dd55"
archetypes      = []
modules         = ["core"]

[commands.build]
desc     = "Regenerate ./admin and audit for drift"
steps    = ["build"]
group    = 1
priority = 10

[commands.dev]
desc     = "Run admin-gen on this project interactively"
steps    = ["run-dev"]
group    = 1
priority = 20

[commands.deploy]
desc     = "Install to ~/.admin"
steps    = ["install"]
group    = 1
priority = 30

[commands.test]
desc     = "Run full test suite (Python + shell)"
steps    = ["test"]
group    = 2
priority = 10

[actions.build]
kind = "shell"
desc = "Regenerate ./admin and audit for drift"
run  = "python3 ./admin-gen --regenerate . --force-dirty && python3 ./admin-gen --audit . --force-dirty"

[actions.run-dev]
kind = "shell"
desc = "Run admin-gen on this project interactively"
run  = "python3 ./admin-gen . --force-dirty"

[actions.test]
kind = "python"
desc = "Run full test suite (Python + shell)"
run = """
scripts = [
    ("python3", "tests/test_archetypes.py"),
    ("python3", "tests/test_manifest.py"),
    ("python3", "tests/test_core_logging.py"),
    ("python3", "tests/test_logtail.py"),
    ("python3", "tests/test_apple.py"),
    ("python3", "tests/test_ports.py"),
    ("bash",    "tests/test_install.sh"),
]
failed = []
for interp, script in scripts:
    rc = subprocess.run([interp, script]).returncode
    if rc != 0:
        failed.append(script)
if failed:
    err("FAILED: " + ", ".join(failed))
    sys.exit(1)
ok(str(len(scripts)) + " test suites passed")
"""

[actions.install]
kind = "shell"
desc = "Install to ~/.admin"
run  = "bash install.sh"
