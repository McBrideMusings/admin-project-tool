project_name    = "admin-project-tool"
python_min      = "3.11"
archetypes      = []
modules         = ["core"]

[commands.build]
desc     = "Validate admin.toml (parse + resolve + consistency)"
steps    = ["check"]
group    = 1
priority = 10

[commands.deploy]
desc     = "Install to ~/.admin"
steps    = ["install", "tampermonkey"]
group    = 1
priority = 30

[commands.tampermonkey]
desc     = "Provision the log-bridge userscript into Tampermonkey (Arc/Chrome/Brave, every profile)"
steps    = ["tampermonkey"]
group    = 1
priority = 40

[commands.tampermonkey-status]
desc     = "Show whether the userscript policy reached each browser profile and installed"
steps    = ["tampermonkey-status"]
group    = 1
priority = 41

[commands.test]
desc     = "Run full test suite (Python + shell)"
steps    = ["test"]
group    = 2
priority = 10

[actions.check]
kind = "shell"
desc = "Validate this repo's manifest via the interpreter CLI"
run  = "python3 ./admin-run check ."

[actions.test]
kind = "shell"
desc = "Run full test suite (pytest + shell)"
run  = ".venv/bin/pytest tests/ && bash tests/test_install.sh && bash tests/test_uninstall.sh"

[actions.install]
kind = "shell-passthrough"
desc = "Install to ~/.admin (--link symlinks instead of copying, so edits are live)"
run  = "bash install.sh"

[actions.tampermonkey]
kind = "shell"
desc = "Write the Tampermonkey jsonImport policy for tampermonkey/log-bridge.user.js"
run  = "python3 -m admin_lib.tampermonkey tampermonkey/log-bridge.user.js"

[actions.tampermonkey-status]
kind = "shell"
desc = "Read back policy → delivery → install state per browser profile"
run  = "python3 -m admin_lib.tampermonkey --status"
