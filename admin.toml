project_name    = "admin-project-tool"
python_min      = "3.11"
archetypes      = []
modules         = ["core"]

[commands.build]
desc     = "Validate admin.toml (parse + resolve + consistency)"
steps    = ["check"]
group    = 1
priority = 10

[commands.deploy]
desc     = "Install to ~/.admin"
steps    = ["install"]
group    = 1
priority = 30

[commands.test]
desc     = "Run full test suite (Python + shell)"
steps    = ["test"]
group    = 2
priority = 10

[actions.check]
kind = "shell"
desc = "Validate this repo's manifest via the interpreter CLI"
run  = "python3 ./admin-run check ."

[actions.test]
kind = "shell"
desc = "Run full test suite (pytest + shell)"
run  = ".venv/bin/pytest tests/ && bash tests/test_install.sh"

[actions.install]
kind = "shell-passthrough"
desc = "Install to ~/.admin (--link symlinks instead of copying, so edits are live)"
run  = "bash install.sh"
