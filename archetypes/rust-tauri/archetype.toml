name = "rust-tauri"
modules = ["core"]

[commands.build]
desc = "Build Tauri app bundle"
steps = ["build"]

[commands.dev]
desc = "Run Tauri app in development mode"
steps = ["dev"]

[commands.test]
desc = "Run all tests"
steps = ["test"]

[commands.vet]
desc = "Run Clippy linter"
steps = ["vet"]

[commands.fmt]
desc = "Format all source files"
steps = ["fmt"]

[commands.clean]
desc = "Remove build artifacts"
steps = ["clean"]

[actions.build]
kind = "shell"
run = "cargo tauri build"
desc = "Build Tauri app bundle"

[actions.dev]
kind = "shell"
run = "cargo tauri dev"
desc = "Run Tauri app in development mode"

[actions.test]
kind = "shell"
run = "cargo test --workspace"
desc = "Run all tests"

[actions.vet]
kind = "shell"
run = "cargo clippy --workspace -- -D warnings"
desc = "Run Clippy linter"

[actions.fmt]
kind = "shell"
run = "cargo fmt --all"
desc = "Format all source files"

[actions.clean]
kind = "shell"
run = "cargo clean"
desc = "Remove build artifacts"
