name = "docker"
modules = ["core", "docker", "remote", "log_format", "log_columns", "unraid"]
order = ["build", "deploy", "---", "logs", "diff", "open"]

[urls]
prod = "${PROD_URL:-http://localhost}"

[commands.build]
desc = "Build the Docker image — locally for linux/amd64, or on the target when [docker_build].on_host"
steps = ["build"]

[commands.deploy]
desc = "Deploy to Unraid — `image` (default), `files` ([deploy] mirror dir), or `all`; --dry-run to preview"
steps = ["deploy"]

[commands.deploy.env]
ADMIN_LOCAL = "${DEPLOY_LOCAL:-false}"

[commands.diff]
desc = "Show run-config drift between current container and last deploy; --format json for CI"
steps = ["diff"]

[commands.diff.env]
ADMIN_LOCAL = "${DEPLOY_LOCAL:-false}"

[commands.logs]
desc = "Tail logs — `dev` (newest local log) or `live` (container); --from DD:HH:MM:SS rolls back, --tail N --no-follow prints and exits"
steps = ["logs"]

[commands.logs.env]
ADMIN_LOCAL = "${DEPLOY_LOCAL:-false}"

[commands.reload]
desc = "Build+run with reload loop (press r or SIGUSR1 to rebuild)"
steps = ["reload"]

[commands.run-args]
desc = "Print [docker_run] rendered to shlex-quoted `docker run` args (for external native-build scripts)"
steps = ["run-args"]
log = false

[commands.open]
desc = "Open the deployed app URL"
steps = ["open"]

[actions.build]
kind = "python"
desc = "Build the Docker image — locally for linux/amd64, or on the target when [docker_build].on_host"
run = '''
_target = (globals().get('_DOCKER_RUN_CONFIG') or {}).get('target')
_bcfg = globals().get('_DOCKER_BUILD_CONFIG') or {}
if _bcfg.get('on_host'):
    _user = os.environ.get('UNRAID_USER', 'root')
    _host = f"{_user}@{os.environ.get('UNRAID_HOST')}"
    sys.exit(remote_docker_build(_host, os.environ.get('APP_IMAGE'), _build_context(_bcfg), target=_target))
docker_build(os.environ.get('APP_IMAGE'), platform='linux/amd64', target=_target)'''

[actions.deploy]
kind = "python"
desc = "Deploy to Unraid — `image` (default, rebuild + recreate from [docker_run]), `files` ([deploy] mirror dir only), or `all`; --force to override drift, --dry-run to preview"
run = '''
_run_cfg = globals().get('_DOCKER_RUN_CONFIG') or {}
sys.exit(deploy_dispatch(args, run_cfg=_run_cfg or None, deploy_cfg=deploy_cfg_with_chown_default(globals().get('_DEPLOY_CONFIG'), _run_cfg.get('user')), template_cfg=globals().get('_INSTALL_TEMPLATE_CONFIG') or {}, build_cfg=globals().get('_DOCKER_BUILD_CONFIG') or None))'''

[actions.diff]
kind = "python"
desc = "Show run-config drift between current container and last deploy; --format json for CI"
run = '''
user = os.environ.get('UNRAID_USER', 'root')
host = f"{user}@{os.environ.get('UNRAID_HOST')}"
output_format = 'json' if '--format' in args else 'text'
sys.exit(remote_container_diff(host, os.environ.get('APP_IMAGE'), output_format=output_format))'''

[actions.logs]
kind = "python"
desc = "Tail logs — `dev` (newest local log) or `live` (container); --from DD:HH:MM:SS rolls back, --tail N --no-follow prints and exits"
run = "sys.exit(logs_dispatch(args, image=os.environ.get('APP_IMAGE')))"

[actions.reload]
kind = "docker-reload-loop"
run = "docker build -t ${APP_IMAGE} . && docker run --rm ${APP_IMAGE}"
desc = "Build+run with reload loop (press r or SIGUSR1 to rebuild)"

[actions.run-args]
kind = "python"
desc = "Print [docker_run] rendered to shlex-quoted `docker run` args (for external native-build scripts). Expands env_file into -e NAME=VALUE tokens, so any secrets appear in stdout — treat the output as sensitive."
run = '''
_run_cfg = globals().get('_DOCKER_RUN_CONFIG') or {}
print(render_run_args(_run_cfg))'''

[actions.open]
kind = "shell"
run = "open ${PROD_URL:-http://localhost}"
desc = "Open the deployed app URL"

[actions.print-urls]
kind = "print-urls"
desc = "Print registered URLs and their health status"
