name = "rust"
modules = ["core"]

[commands.build]
desc = "Compile Rust workspace"
steps = ["build"]

[commands.test]
desc = "Run all tests"
steps = ["test"]

[commands.vet]
desc = "Run Clippy linter"
steps = ["vet"]

[commands.fmt]
desc = "Format all source files"
steps = ["fmt"]

[commands.clean]
desc = "Remove build artifacts"
steps = ["clean"]

[actions.build]
kind = "shell"
run = "cargo build --workspace"
desc = "Compile Rust workspace"

[actions.test]
kind = "shell"
run = "cargo test --workspace"
desc = "Run all tests"

[actions.vet]
kind = "shell"
run = "cargo clippy --workspace -- -D warnings"
desc = "Run Clippy linter"

[actions.fmt]
kind = "shell"
run = "cargo fmt --all"
desc = "Format all source files"

[actions.clean]
kind = "shell"
run = "cargo clean"
desc = "Remove build artifacts"
