name = "hugo"
modules = ["core"]

[status.dev]
kind = "http"
url  = "http://localhost:1313"

[commands.build]
desc = "Build production site"
steps = ["build"]

[commands.dev]
desc = "Run Hugo dev server with drafts"
steps = ["dev"]

[commands.clean]
desc = "Remove build artifacts"
steps = ["clean"]

[actions.build]
kind = "shell"
run = "hugo --minify -s ${HUGO_SOURCE:-.}"
desc = "Build production site"

[actions.dev]
kind = "shell"
run = "hugo server -D --bind 0.0.0.0 -s ${HUGO_SOURCE:-.}"
desc = "Run Hugo dev server with drafts"

[actions.clean]
kind = "shell"
run = "rm -rf ${HUGO_SOURCE:-.}/public ${HUGO_SOURCE:-.}/resources"
desc = "Remove build artifacts"
