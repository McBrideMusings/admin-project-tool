# herdr: opt in to dispatching window-locale actions, Work-tab workers, and
# kind="workflow" targets into real herdr panes instead of the dashboard's
# built-in hosted pty (ADR-0020). Declaring [terminal] is the whole of what
# this archetype does — the tool has no herdr-specific knowledge of its own;
# internal/agent/herdr talks to whatever ends up in the pane once it exists.
#
# Verified against docs/adr/0020-the-launcher-is-configuration-not-code.md
# @ 587ad6b: `herdr pane split` REQUIRES --direction right|down and emits a
# JSON envelope, not a bare id — extracting .result.pane.pane_id is this
# spawn line's job, not the tool's.
name = "herdr"

[terminal]
spawn  = 'id=$(herdr pane split --current --direction right --cwd "$ADMIN_CWD" --no-focus | jq -r .result.pane.pane_id) && herdr pane run "$id" "$ADMIN_CMD" >/dev/null && echo "$id"'
attach = 'herdr focus "$ADMIN_HANDLE"'
kill   = 'herdr pane close "$ADMIN_HANDLE"'
read   = 'herdr pane read "$ADMIN_HANDLE" --lines 40'
