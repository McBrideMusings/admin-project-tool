name = "unraid-plugin"
modules = ["core", "remote", "unraid"]

[commands.build]
desc = "Build plugin (no-op by default)"
steps = ["build"]

[commands.deploy]
desc = "Push plugin source to Unraid USB"
steps = ["deploy"]

[commands.deploy.env]
ADMIN_LOCAL = "${DEPLOY_LOCAL:-false}"

[commands.register]
desc = "Register/install the plugin on Unraid"
steps = ["register"]

[commands.register.env]
ADMIN_LOCAL = "${DEPLOY_LOCAL:-false}"

[commands.uninstall]
desc = "Uninstall the plugin from Unraid"
steps = ["uninstall"]

[commands.uninstall.env]
ADMIN_LOCAL = "${DEPLOY_LOCAL:-false}"

[actions.build]
kind = "shell"
run = "echo 'unraid-plugin: no build step (source files are pushed directly)'"
desc = "Build plugin (no-op by default)"

[actions.deploy]
kind = "python"
desc = "Push plugin source to Unraid USB"
run = '''
user = os.environ.get('UNRAID_USER', 'root')
host = f"{user}@{os.environ.get('UNRAID_HOST')}"
plugin = os.environ.get('PLUGIN_NAME')
dest = f'/boot/config/plugins/{plugin}'
dest_arg = dest if _is_local_host(host) else f'{host}:{dest}'
sys.exit(run_cmd(f'rsync -av --delete ./ {dest_arg}/'))'''

[actions.register]
kind = "python"
desc = "Register/install the plugin on Unraid"
run = '''
user = os.environ.get('UNRAID_USER', 'root')
host = f"{user}@{os.environ.get('UNRAID_HOST')}"
plugin = os.environ.get('PLUGIN_NAME')
sys.exit(ssh_cmd(host, f'installplg /boot/config/plugins/{plugin}/{plugin}.plg'))'''

[actions.uninstall]
kind = "python"
desc = "Uninstall the plugin from Unraid"
run = '''
user = os.environ.get('UNRAID_USER', 'root')
host = f"{user}@{os.environ.get('UNRAID_HOST')}"
plugin = os.environ.get('PLUGIN_NAME')
sys.exit(ssh_cmd(host, f'removeplg {plugin}'))'''
