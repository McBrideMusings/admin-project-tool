name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python test suites
        run: |
          python3 tests/test_archetypes.py
          python3 tests/test_manifest.py
          python3 tests/test_logtail.py

      - name: Shell test suite
        run: bash tests/test_install.sh

  test-apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apple-specific tests (requires macOS)
        run: python3 tests/test_apple.py
